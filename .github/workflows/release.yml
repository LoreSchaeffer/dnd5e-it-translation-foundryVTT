name: Publish Foundry release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Stage Foundry module
        run: node scripts/build-release.mjs --tag "${{ github.ref_name }}" --output dist/module

      - name: Create module archive
        run: (cd dist/module && zip -r ../module.zip .)

      - name: Create GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: gh release create "$GITHUB_REF_NAME" module.json dist/module.zip --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
